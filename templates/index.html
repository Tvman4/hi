<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity APK Patcher & ID Extractor</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --tab-bg: #21262d;
            --tab-active: #161b22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 650px; background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .tabs-header { display: flex; background-color: var(--tab-bg); border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
        .tab-btn.active { color: var(--text-color); background-color: var(--tab-active); border-bottom: 2px solid var(--accent-color); }
        .tab-content { display: none; padding: 25px; }
        .tab-content.active { display: block; }
        h2 { font-size: 18px; margin-bottom: 8px; }
        p.description { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        input[type="file"] { display: none; }
        .file-upload-label { display: block; padding: 12px; background-color: var(--tab-bg); border: 1px dashed var(--border-color); border-radius: 6px; text-align: center; font-size: 13px; color: var(--text-muted); cursor: pointer; }
        .action-btn { width: 100%; padding: 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .action-btn:hover { background-color: var(--accent-hover); }
        .output-box { margin-top: 20px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; max-height: 150px; overflow-y: auto; color: var(--text-muted); white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs-header">
        <button class="tab-btn active" onclick="switchTab(event, 'patcher-tab')">APK DLL Patcher</button>
        <button class="tab-btn" onclick="switchTab(event, 'extractor-tab')">ID Extractor</button>
    </div>

    <!-- Tab 1: Patcher -->
    <div id="patcher-tab" class="tab-content active">
        <h2>Unity APK DLL Injector</h2>
        <p class="description">Upload your APK and replacement DLL. The backend will inject it into the package structure.</p>
        <div class="form-group">
            <label for="apk-file" class="file-upload-label" id="apk-label">Choose APK File...</label>
            <input type="file" id="apk-file" accept=".apk" onchange="updateLabel('apk-file', 'apk-label')">
        </div>
        <div class="form-group">
            <label for="dll-file" class="file-upload-label" id="dll-label">Choose DLL File...</label>
            <input type="file" id="dll-file" accept=".dll" onchange="updateLabel('dll-file', 'dll-label')">
        </div>
        <button class="action-btn" onclick="uploadAndPatch()">Patch & Download APK</button>
        <div id="patcher-output" class="output-box">Ready...</div>
    </div>

    <!-- Tab 2: Extractor -->
    <div id="extractor-tab" class="tab-content">
        <h2>PlayFab & Photon ID Extractor</h2>
        <p class="description">Scan target APK binaries and configuration segments for embedded cloud IDs.</p>
        <div class="form-group">
            <label for="extract-apk" class="file-upload-label" id="extract-label">Choose APK File...</label>
            <input type="file" id="extract-apk" accept=".apk" onchange="updateLabel('extract-apk', 'extract-label')">
        </div>
        <button class="action-btn" onclick="uploadAndExtract()">Extract IDs</button>
        <div id="extractor-output" class="output-box">Waiting for APK...</div>
    </div>
</div>

<script>
    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function updateLabel(inputId, labelId) {
        const input = document.getElementById(inputId);
        if (input.files.length > 0) {
            document.getElementById(labelId).textContent = input.files[0].name;
        }
    }

    async function uploadAndPatch() {
        const apk = document.getElementById('apk-file').files[0];
        const dll = document.getElementById('dll-file').files[0];
        const output = document.getElementById('patcher-output');

        if (!apk || !dll) {
            output.textContent = "Error: Please choose both files.";
            return;
        }

        output.textContent = "Uploading and injecting DLL into APK structure...";
        const formData = new FormData();
        formData.append('apk', apk);
        formData.append('dll', dll);

        try {
            const res = await fetch('/api/patch', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                output.textContent = "Success! Starting file download...";
                window.location.href = data.download_url;
            } else {
                output.textContent = "Error: " + (data.error || "Unknown patch error");
            }
        } catch (err) {
            output.textContent = "Request failed: " + err;
        }
    }

    async function uploadAndExtract() {
        const apk = document.getElementById('extract-apk').files[0];
        const output = document.getElementById('extractor-output');

        if (!apk) {
            output.textContent = "Error: Please choose an APK file.";
            return;
        }

        output.textContent = "Scanning internal APK assemblies and assets...";
        const formData = new FormData();
        formData.append('apk', apk);

        try {
            const res = await fetch('/api/extract', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                output.textContent = `[Scan Complete]\nPlayFab Title ID: ${data.playfab.join(', ')}\nPhoton Realtime ID: ${data.photon.join(', ')}`;
            } else {
                output.textContent = "Error: " + (data.error || "Unknown extract error");
            }
        } catch (err) {
            output.textContent = "Request failed: " + err;
        }
    }
</script>

</body>
</html>
